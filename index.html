<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Örnek Sayfa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- ✅ Navbar -->
    <nav class="bg-silver-600 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-gray text-2xl font-bold">AI Kulüp</a>
            <ul class="hidden md:flex space-x-4">
                <li><a href="#" class="text-gray hover:underline">Anasayfa</a></li>
                <li><a href="#" class="text-gray hover:underline">Hakkımızda</a></li>
                <li><a href="#" class="text-gray hover:underline">İletişim</a></li>
            </ul>
        </div>
    </nav>

    <!-- ✅ Hero Bölümü -->
    <section class="flex flex-col items-center text-center py-16 bg-blue-500 text-white">
        <h1 class="text-4xl font-bold">En İyi Yapay Zeka Kaynakları Bir Arada</h1>
        <p class="text-lg mt-4 md:w-1/2">Yapay zeka dünyasına adım atmak ya da becerilerinizi bir üst seviyeye taşımak için ihtiyacınız olan tüm araçlar burada!</p>
        <a href="#" class="mt-6 bg-white text-blue-600 px-6 py-3 rounded-lg font-semibold hover:bg-gray-200">
            Daha Fazla Bilgi
        </a>
    </section>

    <!-- ✅ İçerik Bölümü -->
    <section class="container mx-auto px-6 py-12">
        <h2 class="text-2xl font-bold text-center">AI Siteler</h2>
        <div class="max-w-2xl mx-auto p-4">
            <ul id="content" class="space-y-4">
                <!-- List Content -->                
            </ul>
        </div>
    </section>

    <!-- ✅ Footer -->
    <footer class="bg-gray-800 text-white text-center py-4">
        <p>&copy; 2025 Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
